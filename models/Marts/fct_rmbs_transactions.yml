version: 2

models:
  - name: fct_rmbs_transactions
    description: "Fact table containing RMBS transactions at transaction grain"

    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - not_null
          - unique

      - name: loan_id
        description: "Loan identifier"
        tests:
          - not_null

      - name: transaction_amount
        description: "Transaction amount"
        tests:
          - not_null
